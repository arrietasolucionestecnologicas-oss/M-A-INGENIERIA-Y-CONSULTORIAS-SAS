ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.michael.tms.ApplicationKt.module ]
    }
}

database {
    jdbcUrl = "jdbc:postgresql://localhost:5432/tms"
    jdbcUrl = ${?DATABASE_URL}
    user = "tms_user"
    user = ${?DATABASE_USER}
    password = "tms_password"
    password = ${?DATABASE_PASSWORD}
}

jwt {
    secret = "please-override-this-secret-with-a-real-one-via-env-var"
    secret = ${?JWT_SECRET}
    issuer = "tms-api"
    issuer = ${?JWT_ISSUER}
    audience = "tms-clients"
    audience = ${?JWT_AUDIENCE}
    realm = "tms"
    realm = ${?JWT_REALM}
    expirationMinutes = 480
    expirationMinutes = ${?JWT_EXPIRATION_MINUTES}
}

admin {
    masterToken = "please-override-this-master-token-via-env-var"
    masterToken = ${?ADMIN_MASTER_TOKEN}
}
